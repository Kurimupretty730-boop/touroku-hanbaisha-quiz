<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>登録販売者 午後200問</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main class="app"><div class="top"><div class="brand"><h1>登録販売者｜午後200問</h1><span class="pill" id="scope">全200問</span></div><div class="progressbar"><div id="pbar"></div></div><div class="stats"><div class="stat"><b id="seen">0</b><span>回答済</span></div><div class="stat"><b id="weak">0</b><span>弱点</span></div><div class="stat"><b id="mastered">0</b><span>定着</span></div><div class="stat"><b id="remain">200</b><span>残り</span></div></div><div class="toolbar"><select id="mode"><option value="course">全問1周→弱点反復</option><option value="weak">弱点のみ</option><option value="random">未定着ランダム</option></select><select id="year"><option value="all">令和元〜5年度</option><option value="1">令和元年度</option><option value="2">令和2年度</option><option value="3">令和3年度</option><option value="4">令和4年度</option><option value="5">令和5年度</option></select></div></div><section id="quiz"></section></main><div class="footbar"><button id="settings">⚙️ 設定・進捗移行</button></div><div class="modal" id="modal"><div class="modalbox"><h2>設定・進捗データ</h2><p class="small">学習記録はこの端末のブラウザに保存されます。スマホとPCの間で移す場合は「進捗を書き出す」→別端末で「読み込む」を使えます。</p><div class="row"><button id="export">進捗を書き出す</button><label><span style="display:inline-block;border:1px solid #ccc;background:#fff;border-radius:10px;padding:10px;cursor:pointer">進捗を読み込む</span><input id="import" type="file" accept="application/json" hidden></label></div><hr><p class="small"><b>定着ルール：</b>初見で正解した問題は定着。1度でも不正解または「わからない」になった問題は弱点に入り、その後2回連続正解で定着します。全200問を1周した後、弱点だけを自動反復します。</p><div class="row"><button class="danger" id="reset">全記録をリセット</button><button id="close">閉じる</button></div></div></div><script src="data.js"></script><script src="app.js"></script></body></html>
