<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><title>登録販売者 6年720問</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="top"><div class="brand"><h1>登録販売者｜6年720問</h1><span id="scope" class="pill">全720問</span></div><div class="progressbar"><div id="pbar"></div></div><div class="stats"><div class="stat"><b id="seen">0</b><span>回答済</span></div><div class="stat"><b id="correct">0</b><span>正解</span></div><div class="stat"><b id="weak">0</b><span>弱点</span></div></div></header><section id="home"></section><section id="quiz" class="hidden"></section><section id="listPage" class="hidden"></section><section id="kanpo" class="hidden"></section></main><nav class="footbar"><button id="tabHome" class="active">🏠 ホーム</button><button id="tabWeak">★ 一覧</button><button id="settings">⚙️ 設定</button></nav><div class="modal" id="modal"><div class="modalbox"><h2>設定・進捗</h2><div id="verifyStatus" class="verify"></div><p class="small">記録はこのブラウザに保存されます。</p><div class="row"><button id="export">進捗を書き出す</button><label><span class="filebtn">進捗を読み込む</span><input id="import" type="file" accept="application/json" hidden></label></div><hr><div class="row"><button id="reset" class="danger">全記録をリセット</button><button id="close">閉じる</button></div></div></div><script src="data.js"></script><script src="app.js"></script></body></html>
